

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = float-pavucontrol
    match:class = pavucontrol
    float = yes
    center = yes
}

windowrule {
    name = float-nm
    match:class = nm-connection-editor
    float = yes
    center = yes
}

windowrule {
    name = float-blueman
    match:class = blueman-manager
    float = yes
    center = yes
}

windowrule {
    name = float-settings
    match:title = Preferencias
    float = yes
    center = yes
}

windowrule {
    name = float-config
    match:title = Configuración
    float = yes
    center = yes
}

windowrule {
    name = flameshot
    match:class = flameshot
    float = yes
}

windowrule {
    name = ml4w-calendar
    match:class = (com.ml4w.calendar)
    float = true
    size = 400 400
}

windowrule {
    name = vhsfetch
    match:class = vsfetch
    float = yes
    center = yes
    size = 700 700
}

windowrule {
    name = ai-webapps
    match:class = webapp-.*
    float = yes
    center = yes
    size = 1000 700
}


blurls = rofi


general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 0deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.9
    dim_inactive = false
    dim_strength = 0.2

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1e1e2ecc)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.5
    }

}

xwayland {
    force_zero_scaling = true

}

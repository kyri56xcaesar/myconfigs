
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 0deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = false
    dim_strength = 0.5

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2ecc)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.2
    }

}

xwayland {
    force_zero_scaling = true

}

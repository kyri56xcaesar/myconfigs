
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(88c0d0ff) rgba(5e81acff) 45deg
    col.inactive_border = rgba(4c566aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = false
    dim_strength = 0.2

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(2e3440cc)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.3
    }

}

xwayland {
    force_zero_scaling = true

}

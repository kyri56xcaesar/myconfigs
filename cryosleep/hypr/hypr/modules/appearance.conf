
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 3
    col.active_border = rgba(cba6f7ff) rgba(f38ba8ff) 0deg
    col.inactive_border = rgba(ffffff18)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 16
    active_opacity = 0.95
    inactive_opacity = 0.85
    dim_inactive = true
    dim_strength = 0.3

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 14
        passes = 4
        vibrancy = 0.8
    }

}

xwayland {
    force_zero_scaling = true

}

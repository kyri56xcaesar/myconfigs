
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(444466aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = false
    dim_strength = 0.2

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(000000aa)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.2
    }

}

xwayland {
    force_zero_scaling = true

}

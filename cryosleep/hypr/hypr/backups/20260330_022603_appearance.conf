
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(888888ff) rgba(888888ff) 45deg
    col.inactive_border = rgba(444444ff)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.2

    shadow {
        enabled = false
        range = 10
        render_power = 3
        color = rgba(000000cc)
    }

    blur {
        enabled = false
        size = 6
        passes = 2
        vibrancy = 0.2
    }

}

xwayland {
    force_zero_scaling = true

}

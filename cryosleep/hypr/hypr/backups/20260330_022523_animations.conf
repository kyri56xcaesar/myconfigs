animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, easeOut, slide
    animation = windowsMove, 1, 5, overshot, slide
    animation = border, 1, 10, easeOut
    animation = fade, 1, 5, easeOut
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = fadeSwitch, 1, 5, easeOut
    animation = fadeDim, 1, 4, easeOut
    animation = fadeShadow, 1, 3, easeOut
    animation = workspaces, 1, 5, overshot, slidevert
    animation = specialWorkspace, 1, 6, overshot, slidevert
    animation = layers, 1, 4, easeOut, slide top
    animation = borderangle, 1, 20, linear, loop
}

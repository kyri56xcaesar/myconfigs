
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 6
    col.active_border = rgba(cba6f7ff) rgba(62a0eaff) 0deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 10
    active_opacity = 0.9
    inactive_opacity = 0.8
    dim_inactive = true
    dim_strength = 0.25

    shadow {
        enabled = true
        range = 10
        render_power = 4
        color = rgba(000000ff)
    }

    blur {
        enabled = true
        size = 10
        passes = 3
        vibrancy = 0.9
    }

}

xwayland {
    force_zero_scaling = true

}

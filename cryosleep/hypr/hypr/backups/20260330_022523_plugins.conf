
plugin:hyprexpo {
    columns = 3
    gap_size = 5
    bg_col = rgba(000000ff)
    workspace_method = center current

}

plugin:hyperfocus {
    mode = shrink
    slide_height = 25

}

plugin:borders-plus-plus {
    add_borders = 1
    col.border_1 = rgba(ffffffff)
    col.border_2 = rgba(ff000000)
    border_size_1 = 2
    natural_rounding = true

}

plugin:hyprbars {
    bar_height = 15
    bar_color = rgba(1e1e2eff)
    col.text = rgba(ffffffff)
    inactive_button_color = rgba(ffffff33)
    bar_text_size = 10
    bar_text_font = Sans
    bar_text_align = center
    bar_buttons_alignment = right
    bar_blur = false
    bar_title_enabled = true
    bar_part_of_window = false
    bar_precedence_over_border = false
    bar_padding = 7
    bar_button_padding = 5
    icon_on_hover = false
    hyprbars-button = rgba(ff5555ff), 8, , hyprctl dispatch killactive
    hyprbars-button = rgba(f1fa8cff), 8, , hyprctl dispatch movetoworkspace special
    hyprbars-button = rgba(50fa7bff), 8, , hyprctl dispatch fullscreen 1

}

plugin:hyprtrails {
    color = rgba(ffaa0088)

}

plugin:hyprscrolling {
    column_width = 0.5
    follow_focus = true
    fullscreen_on_one_column = false

}

plugin:split-monitor-workspaces {
    count = 10
    enable_wrapping = 1
    enable_notifications = 0

}

plugin:hyprgrass {
    sensitivity = 4.0
    workspace_swipe_fingers = 3
    long_press_delay = 400
    resize_on_border_long_press = true

}
